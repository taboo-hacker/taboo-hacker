name: Refresh Profile Assets

# 自动刷新 README 里那些「会动的东西」：
#   🐍 贪吃蛇贡献图 · 📊 统计卡片 · 🏙️ 3D 贡献城市
on:
  workflow_dispatch:
  schedule:
    # 每天 02:20 (UTC+8)
    - cron: "20 18 * * *"
  push:
    branches: [main]
    paths:
      - "README.md"
      - ".github/workflows/profile-assets.yml"

concurrency:
  group: profile-assets
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    # 避免自己提交自己触发死循环
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Prepare directories
        run: mkdir -p assets

      - name: Generate stats card (custom, REST-only)
        # 不用 github-readme-stats：Actions 里的安装令牌读不到用户级 GraphQL 数据，
        # 那张卡片会直接变成 "Something went wrong"。这里用公开 REST 接口自己画。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: python3 tools/make_stats_svg.py

      - name: Generate top languages card (custom, REST-only)
        # 同样自己画：第三方卡片的标题写死 "Most Used Languages"，改不动
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: python3 tools/make_langs_svg.py

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg?palette=github-dark&color_snake=#E8B04B&color_dots=#1A1416,#4A2318,#8C3A1E,#C9482F,#E8B04B
            assets/snake-light.svg?palette=github-light&color_snake=#D9482F

      - name: Generate 3D contribution graph (中文标签)
        # SETTING_JSON 里配了 l10n：雷达图五个维度 + 底部 "N contributions" 全部中文化
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: profile-3d-settings.json

      - name: Drop the unused 3D themes
        # 自定义设置只会产出 profile-night-cn.svg，其余主题文件不再生成，顺手清掉
        run: find profile-3d-contrib -maxdepth 1 -name '*.svg' ! -name 'profile-night-cn.svg' -delete

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets profile-3d-contrib
          if git diff --cached --quiet; then
            echo "No asset changes, nothing to commit."
            exit 0
          fi
          git commit -m "chore: refresh profile assets [skip ci]"
          git push origin HEAD:main
